name: Finalize v0.2.9 release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-v0.2.9.yml

permissions:
  contents: write

env:
  TARGET_SHA: f91cf9843425616e0730a459c25d4f340e448e47
  TAG: v0.2.9
  VERSION: 0.2.9
  PACKAGE: '@ychris12138/dsh-usage-stats'

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release target
        run: |
          test "$(git show "$TARGET_SHA:package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')" = "$VERSION"
          test "$(git show "$TARGET_SHA:package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).name))')" = "$PACKAGE"
          git show "$TARGET_SHA:catalog/v1/plugins.json" > /tmp/plugins.json
          node - <<'NODE'
          const p = require('/tmp/plugins.json');
          if (p.revision !== process.env.VERSION) throw new Error(`catalog revision ${p.revision}`);
          if (p.items?.[0]?.latestVersion !== process.env.VERSION) throw new Error(`latestVersion ${p.items?.[0]?.latestVersion}`);
          if (p.items?.[0]?.name !== process.env.PACKAGE) throw new Error(`catalog package ${p.items?.[0]?.name}`);
          NODE
          git show "$TARGET_SHA:lib/client.js" | grep -F 'id: "@ychris12138/dsh-usage-stats"'
          git show "$TARGET_SHA:lib/client.js" | grep -F 'tag.dataset.plugin = "@ychris12138/dsh-usage-stats"'
          git show "$TARGET_SHA:cordis.patch.yml" | grep -F 'name: "@ychris12138/dsh-usage-stats"'

      - name: Create or verify annotated tag
        run: |
          if git rev-parse "$TAG^{commit}" >/dev/null 2>&1; then
            test "$(git rev-parse "$TAG^{commit}")" = "$TARGET_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$TARGET_SHA" -m "$TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" = "$TAG"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG — scoped installer identity hardening" \
              --notes $'## Highlights\n\n- Align the fallback installer with the scoped npm identity `@ychris12138/dsh-usage-stats`.\n- Install fallback files under `node_modules/@ychris12138/dsh-usage-stats` and migrate legacy/unquoted Cordis entries safely.\n- Align browser style ownership (`data-plugin`) with the scoped package identity; credit to @noneowl / PR #51 for identifying this remaining identity mismatch.\n- Add regression coverage for scoped paths, YAML quoting, migration, idempotency, and client style ownership.\n- Sync README and Community Market metadata to `0.2.9`.\n\nPublished npm package: `@ychris12138/dsh-usage-stats@0.2.9`.'
          fi

      - name: Verify public Pages catalog
        run: |
          set -euo pipefail
          manifest='https://ychris12138.github.io/dsh-usage-stats/catalog-source.json'
          plugins='https://ychris12138.github.io/dsh-usage-stats/v1/plugins'
          ok=0
          for i in $(seq 1 30); do
            m_meta=$(curl -sS -L -o /tmp/manifest.json -w '%{http_code} %{content_type}' "$manifest" || true)
            p_meta=$(curl -sS -L -o /tmp/plugins-public.json -w '%{http_code} %{content_type}' "$plugins" || true)
            if [ "$m_meta" = '200 application/json' ] && [ "$p_meta" = '200 application/json' ]; then
              if node - <<'NODE'
              const fs = require('fs');
              const m = JSON.parse(fs.readFileSync('/tmp/manifest.json', 'utf8'));
              const p = JSON.parse(fs.readFileSync('/tmp/plugins-public.json', 'utf8'));
              const item = p.items?.[0];
              if (m.providerId !== 'io.github.ychris12138.dsh-usage-stats') process.exit(1);
              if (p.revision !== '0.2.9') process.exit(1);
              if (item?.latestVersion !== '0.2.9') process.exit(1);
              if (item?.name !== '@ychris12138/dsh-usage-stats') process.exit(1);
              NODE
              then ok=1; break; fi
            fi
            sleep 10
          done
          test "$ok" = 1

      - name: Remove one-shot finalizer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/finalize-v0.2.9.yml
          git commit -m "chore: remove v0.2.9 release finalizer"
          git push
