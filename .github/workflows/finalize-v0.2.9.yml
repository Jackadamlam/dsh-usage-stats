name: Finalize v0.2.9 release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-v0.2.9.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: f91cf9843425616e0730a459c25d4f340e448e47
      TAG: v0.2.9
      PACKAGE: '@ychris12138/dsh-usage-stats'
      VERSION: 0.2.9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tested release target
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$TARGET_SHA^{commit}"
          test "$(git show "$TARGET_SHA:package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).name))')" = "$PACKAGE"
          test "$(git show "$TARGET_SHA:package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')" = "$VERSION"
          test "$(git show "$TARGET_SHA:catalog/v1/plugins.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).revision))')" = "$VERSION"
          git show "$TARGET_SHA:lib/client.js" | grep -F 'id: "@ychris12138/dsh-usage-stats"'
          git show "$TARGET_SHA:lib/client.js" | grep -F 'tag.dataset.plugin = "@ychris12138/dsh-usage-stats"'
          git show "$TARGET_SHA:cordis.patch.yml" | grep -F 'name: "@ychris12138/dsh-usage-stats"'

      - name: Create or verify exact annotated tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            test "$(git rev-list -n1 "$TAG")" = "$TARGET_SHA"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" "$TARGET_SHA" -m "$TAG — scoped installer identity hardening"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            cat > /tmp/release-notes.md <<'EOF'
          ## v0.2.9 — scoped installer identity hardening

          This release completes the scoped npm identity migration across the fallback installer and browser style ownership metadata.

          ### Fixed
          - Install fallback files under `node_modules/@ychris12138/dsh-usage-stats` instead of the legacy unscoped directory.
          - Write the quoted scoped Cordis identity and migrate legacy or invalid unquoted entries in place.
          - Reject malformed, duplicate, or legacy identities in installer `--check` mode.
          - Align browser `data-plugin` style ownership with `@ychris12138/dsh-usage-stats` for DSH client style/HMR ownership.
          - Add regression coverage for scoped paths, YAML quoting, migration, idempotency, and client style ownership.
          - Sync README and Community Market metadata to `0.2.9`.

          ### Contributor credit
          Thanks to @noneowl / PR #51 for identifying the remaining client style ownership identity mismatch; that contribution is included in this release with co-author credit.

          Published npm package: `@ychris12138/dsh-usage-stats@0.2.9`.
          EOF
            gh release create "$TAG" --target "$TARGET_SHA" --title 'v0.2.9 — scoped installer identity hardening' --notes-file /tmp/release-notes.md
          fi
          test "$(gh release view "$TAG" --json tagName --jq .tagName)" = "$TAG"

      - name: Verify public Pages catalog
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const urls = [
            'https://ychris12138.github.io/dsh-usage-stats/catalog-source.json',
            'https://ychris12138.github.io/dsh-usage-stats/v1/plugins',
          ];
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          for (let attempt = 1; attempt <= 15; attempt++) {
            try {
              const [manifestRes, pageRes] = await Promise.all(urls.map(url => fetch(url, { redirect: 'follow', cache: 'no-store' })));
              if (!manifestRes.ok || !pageRes.ok) throw new Error(`HTTP ${manifestRes.status}/${pageRes.status}`);
              if (!manifestRes.headers.get('content-type')?.includes('application/json')) throw new Error(`manifest MIME=${manifestRes.headers.get('content-type')}`);
              if (!pageRes.headers.get('content-type')?.includes('application/json')) throw new Error(`provider MIME=${pageRes.headers.get('content-type')}`);
              const manifest = await manifestRes.json();
              const page = await pageRes.json();
              const item = page.items?.[0];
              if (manifest.providerId !== 'io.github.ychris12138.dsh-usage-stats') throw new Error(`providerId=${manifest.providerId}`);
              if (page.revision !== '0.2.9') throw new Error(`revision=${page.revision}`);
              if (item?.latestVersion !== '0.2.9') throw new Error(`latestVersion=${item?.latestVersion}`);
              if (item?.name !== '@ychris12138/dsh-usage-stats') throw new Error(`name=${item?.name}`);
              if (item?.package?.name !== '@ychris12138/dsh-usage-stats') throw new Error(`package=${item?.package?.name}`);
              console.log('Pages catalog verified at 0.2.9');
              process.exit(0);
            } catch (error) {
              console.log(`Pages verification attempt ${attempt} failed: ${error.message}`);
              if (attempt === 15) throw error;
              await sleep(8000);
            }
          }
          NODE

      - name: Remove one-time finalizer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          if test -f .github/workflows/finalize-v0.2.9.yml; then
            git rm .github/workflows/finalize-v0.2.9.yml
            git commit -m 'chore: remove v0.2.9 release finalizer'
            git push origin main
          fi
