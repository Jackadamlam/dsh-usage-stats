name: Capture 1024Store v0.2.8 verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-1024store-v0.2.8.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch current 1024Store registry
        shell: bash
        run: |
          set -euo pipefail
          if curl -fsSL --retry 3 --retry-delay 2 --max-time 60 \
            'https://deepseek1024.com/api/v1/plugins' -o /tmp/registry.json; then
            echo ok > /tmp/fetch-status
          else
            echo failed > /tmp/fetch-status
            printf '{"packages":[]}\n' > /tmp/registry.json
          fi

      - name: Build temporary result
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const fetchStatus = fs.readFileSync('/tmp/fetch-status', 'utf8').trim();
          const result = {
            checkedAt: new Date().toISOString(),
            outcome: fetchStatus === 'ok' ? 'missing' : 'unavailable',
            detail: fetchStatus === 'ok' ? 'catalog record not found' : '1024Store API fetch failed',
            npmMethods: [],
          };
          if (fetchStatus === 'ok') {
            const data = JSON.parse(fs.readFileSync('/tmp/registry.json', 'utf8'));
            const entries = Array.isArray(data.packages) ? data.packages : [];
            const target = entries.find(item => {
              const url = typeof item?.url === 'string' ? item.url.toLowerCase().replace(/\.git$/, '') : '';
              const id = typeof item?.id === 'string' ? item.id.toLowerCase() : '';
              return url === 'https://github.com/ychris12138/dsh-usage-stats' || id === 'ychris12138/dsh-usage-stats';
            });
            if (target) {
              const methods = Array.isArray(target.installMethods) ? target.installMethods : [];
              result.npmMethods = methods
                .filter(m => m && typeof m === 'object' && m.kind === 'npm' && m.spec === '@ychris12138/dsh-usage-stats')
                .map(m => ({
                  revision: m.revision ?? null,
                  verification: m.verification ?? null,
                  code: m.code ?? null,
                  requiresBuildAllowance: m.requiresBuildAllowance ?? null,
                }));
              const exact = result.npmMethods.some(m => m.revision === '0.2.8'
                && m.verification === 'verified'
                && m.code === 'repository_backlink'
                && m.requiresBuildAllowance === false);
              result.outcome = exact ? 'synced' : 'stale';
              result.detail = exact
                ? 'reviewed repository_backlink target is 0.2.8'
                : 'record exists but exact reviewed repository_backlink target is not 0.2.8 yet';
            }
          }
          fs.writeFileSync('.tmp-1024store-v0.2.8-result.json', JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result, null, 2));
          NODE

      - name: Replace verifier with temporary result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          git rm .github/workflows/verify-1024store-v0.2.8.yml
          git add .tmp-1024store-v0.2.8-result.json
          git commit -m 'chore: capture 1024Store v0.2.8 verification result'
          git push origin main
